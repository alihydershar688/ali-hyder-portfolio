<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ali Hyder portfolio preview</title>
  <desc id="desc">A modern social card for Ali Hyder's portfolio.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#07111d"/>
      <stop offset="100%" stop-color="#111f2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#7c9cff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="64" y="64" width="1072" height="502" rx="30" fill="#0d1827" stroke="#23395d"/>
  <circle cx="170" cy="180" r="52" fill="url(#accent)" opacity="0.92"/>
  <text x="250" y="200" fill="#edf6ff" font-family="Verdana, Arial, sans-serif" font-size="54" font-weight="700">Ali Hyder</text>
  <text x="250" y="270" fill="#8bb6ff" font-family="Verdana, Arial, sans-serif" font-size="28" font-weight="600">Full-Stack Software Engineer</text>
  <text x="250" y="360" fill="#dfeafc" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="600">Building Digital Products</text>
  <text x="250" y="410" fill="#dfeafc" font-family="Verdana, Arial, sans-serif" font-size="34" font-weight="600">from Frontend to Backend</text>
  <rect x="250" y="452" width="214" height="42" rx="21" fill="url(#accent)"/>
  <text x="288" y="480" fill="#fff" font-family="Verdana, Arial, sans-serif" font-size="20" font-weight="700">Portfolio</text>
</svg>
